[workspace]
members = ["componentize", "guest-fixture", "host"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94.0"

[workspace.dependencies]
anyhow = "=1.0.104"
libc = "=0.2.189"
wit-component = "=0.254.0"
wit-bindgen = "=0.60.0"
wit-parser = "=0.254.0"
wasmtime = { version = "=47.0.2", default-features = false, features = [
  "anyhow",
  "component-model",
  "component-model-async",
  "cranelift",
  "runtime",
  "std",
] }

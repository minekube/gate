name: ci

# The red `ci` run on every release PR is GitHub's documented approval gate, not
# a broken job and not this workflow's trigger.
#
# Every release PR produces a `ci` run that executes nothing: `event=pull_request`,
# `actor=github-actions[bot]`, branch `release-please--branches--master--components--gate`,
# **zero jobs**, and GitHub records it as `failure` once the PR is merged (0.74.24
# run 36327161176; 0.73.9 run 34519830891 still shows the raw `action_required`).
# All 61 runs that branch has ever had are exactly this shape and it has no `push`
# runs at all — release-please pushes with `GITHUB_TOKEN`, and a `GITHUB_TOKEN`
# push creates no workflow runs. The cause is documented:
#
#   "When a pull request is created or updated by a workflow using GITHUB_TOKEN,
#    pull_request events with the opened, synchronize, or reopened activity types
#    create workflow runs that require approval. A user with write access to the
#    repository can approve these runs from the pull request page."
#   — GitHub docs, "Events that trigger workflows" -> pull_request
#
# Nobody approves them, so they expire. There is no `paths:` filter here, so every
# PR — including release-please's — matches this trigger on purpose, and `opened`
# is the activity type release-please hits. Do not try to silence the run with a
# `paths:`/`branches:` filter: the approval requirement comes from the
# `GITHUB_TOKEN` activity, not the trigger, a filter cannot make the run green (a
# non-matching filter produces no run at all — web.yml is the control for that),
# and the gated run publishes no check-run, so filtering it out would remove
# nothing branch protection could ever match.
#
# THE RULE: `ci` (`ci / …`) and every job context this workflow reports
# must never be added to master's required status checks. A release PR cannot
# satisfy any of them: the gated run has zero jobs, so nothing here ever reports
# success on the release branch. Requiring one makes every release PR
# permanently unsatisfied — the auto-merge step in release-please.yml
# (`gh pr merge --merge`, deliberately without `--admin`) fails, `trigger-release`
# and `dispatch-moxy-bump` are skipped and the release silently never publishes.
# That is the stall shape of the v0.74.21 payload bug. master carries no required
# status checks at all today (branch protection reads 404), so the trap is
# latent, not live.
#
# The only real fix — a release PR whose `ci` check is genuinely green-or-red and
# therefore requirable — is for release-please to open its PR with a GitHub
# App/PAT token instead of `GITHUB_TOKEN` (docs, "Triggering a workflow from a
# workflow"). That is a credential change needing approval, so it is deliberately
# not done here. release_check_contract_test.go pins the mechanism, the release PR
# file set, the control workflow and the never-require rule above.
on:
  push:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]

env:
  REGISTRY: ghcr.io

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: golangci-lint
        run: golangci-lint run --timeout 3m0s

      # gohawk@v0.3.2 requires go >= 1.27.0, while this repo declares `go 1.26.0`
      # and every job pins its toolchain to go.mod's version. The runner sets
      # GOTOOLCHAIN=local, so without the explicit pin below the step dies with
      #   go: github.com/kojah/gohawk@v0.3.2: requires go >= 1.27.0
      #       (running go 1.26.0; GOTOOLCHAIN=local)
      # before gohawk analyses anything. The pin is an exact toolchain rather
      # than `auto` so the version stays deterministic, and it is scoped to this
      # step so golangci-lint keeps running on the toolchain the module declares.
      # .github/scripts/check-pinned-go-tools.sh fails the build if this pairing
      # ever drifts (see the pinned-tools job below).
      - name: Run gohawk
        env:
          GOTOOLCHAIN: go1.27.1
        run: go run github.com/kojah/gohawk@v0.3.2 -enable-all -disable=goroutineownership ./...

  # Regression guard for the breakage that red-lit every branch on 2026-09-19
  # (see the Run gohawk step above and minekube/gate#1133): a tool pinned as
  # `go run <module>@<version>` gaining a higher `go` directive than the
  # toolchain its step runs with kills CI before the tool does any work, and
  # every PR waiting on ci.yml (incl. the release cascade's bump PRs) stalls.
  pinned-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify pinned Go tools run with their step toolchain
        run: .github/scripts/check-pinned-go-tools.sh

      # The guard is only as good as its parser: this runs its hermetic
      # fixture suite (no network) covering the toolchain scopes it must
      # honour — step/job/workflow GOTOOLCHAIN, setup-go go-versions, pins in
      # the final step of the final file, flags before the package spec,
      # comments, floating refs.
      - name: Self-test the pinned-tool guard
        run: .github/scripts/check-pinned-go-tools.sh --self-test

  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go with cache
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Smoke test - Geyserlite Windows auto-download starts
        if: matrix.platform == 'windows-latest'
        run: go test ./pkg/edition/bedrock/geyser -tags=geyserlite_smoke -run TestLiteManagedRunnerWindowsAutoDownloadSmoke -count=1 -timeout 6m -v

  # Regression test for https://github.com/minekube/gate/issues/697:
  # The published images crashed with "exec /gate: no such file or directory"
  # because the gate binary is dynamically linked (the geyserlite dependency
  # pulls in github.com/ebitengine/purego, which imports libdl.so.2 via
  # //go:cgo_import_dynamic even with CGO_ENABLED=0) but the runtime base image
  # had no glibc dynamic loader. This job builds the actual images and runs the
  # binary and starts managed Bedrock on both architectures so broken runtime
  # dependencies or cache paths fail CI instead of shipping.
  docker-smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build gate image (host arch, load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          target: gate
          build-args: |
            VERSION=smoke-test
          tags: gate:smoke

      - name: Smoke test - gate binary execs in distroless image
        run: |
          out="$(docker run --rm gate:smoke --version)"
          echo "$out"
          echo "$out" | grep -q "gate version smoke-test"

      - name: Smoke test - managed Bedrock starts in read-only distroless image
        run: |
          cid=$(docker run -d --read-only --tmpfs /tmp \
            -v "$PWD/.github/testdata/managed-bedrock.yml:/config.yml:ro" \
            gate:smoke --config /config.yml)
          trap 'docker logs "$cid" 2>&1 || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 180); do
            logs=$(docker logs "$cid" 2>&1)
            if grep -q "geyser integration started" <<<"$logs"; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
              exit 1
            fi
            sleep 1
          done
          exit 1

      - name: Build jre variant image (host arch, load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          target: jre
          build-args: |
            VERSION=smoke-test
          tags: gate-jre:smoke

      - name: Smoke test - gate binary execs in jre image
        run: |
          out="$(docker run --rm gate-jre:smoke --version)"
          echo "$out"
          echo "$out" | grep -q "gate version smoke-test"

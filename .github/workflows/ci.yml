name: ci
on:
  push:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]

env:
  REGISTRY: ghcr.io

permissions: {}
  # Tagged code and its dependencies run only in read-only jobs. Write
  # capabilities are granted narrowly to fresh publisher jobs below.

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: golangci-lint
        run: golangci-lint run --timeout 3m0s
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go with cache
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Smoke test - Geyserlite Windows auto-download starts
        if: matrix.platform == 'windows-latest'
        run: go test ./pkg/edition/bedrock/geyser -tags=geyserlite_smoke -run TestLiteManagedRunnerWindowsAutoDownloadSmoke -count=1 -timeout 6m -v
  # Regression test for https://github.com/minekube/gate/issues/697:
  # The published images crashed with "exec /gate: no such file or directory"
  # because the gate binary is dynamically linked (the geyserlite dependency
  # pulls in github.com/ebitengine/purego, which imports libdl.so.2 via
  # //go:cgo_import_dynamic even with CGO_ENABLED=0) but the runtime base image
  # had no glibc dynamic loader. This job builds the actual images and runs the
  # binary and starts managed Bedrock on both architectures so broken runtime
  # dependencies or cache paths fail CI instead of shipping.
  docker-smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build gate image (host arch, load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          target: gate
          build-args: |
            VERSION=smoke-test
          tags: gate:smoke

      - name: Smoke test - gate binary execs in distroless image
        run: |
          out="$(docker run --rm gate:smoke --version)"
          echo "$out"
          echo "$out" | grep -q "gate version smoke-test"

      - name: Smoke test - managed Bedrock starts in read-only distroless image
        run: |
          cid=$(docker run -d --read-only --tmpfs /tmp \
            -v "$PWD/.github/testdata/managed-bedrock.yml:/config.yml:ro" \
            gate:smoke --config /config.yml)
          trap 'docker logs "$cid" 2>&1 || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 180); do
            logs=$(docker logs "$cid" 2>&1)
            if grep -q "geyser integration started" <<<"$logs"; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
              exit 1
            fi
            sleep 1
          done
          exit 1

      - name: Build jre variant image (host arch, load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          target: jre
          build-args: |
            VERSION=smoke-test
          tags: gate-jre:smoke

      - name: Smoke test - gate binary execs in jre image
        run: |
          out="$(docker run --rm gate-jre:smoke --version)"
          echo "$out"
          echo "$out" | grep -q "gate version smoke-test"
  # Build tagged/default-branch container images without a registry
  # credential. The OCI archives cross a runner boundary before publication,
  # so a tagged Dockerfile or dependency cannot poison the publisher's PATH or
  # workspace and then use its token.
  image-build:
    if: ( github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') ) || ( github.event_name == 'push' && ( github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') ) )
    needs:
      - lint
      - test
      - docker-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
      image_latest: ${{ steps.image-ref.outputs.image_latest }}
      image_jre: ${{ steps.image-ref.outputs.image_jre }}
      image_jre_latest: ${{ steps.image-ref.outputs.image_jre_latest }}
      image_version: ${{ steps.image-ref.outputs.image_version }}
      image_jre_version: ${{ steps.image-ref.outputs.image_jre_version }}
      gate_digest: ${{ steps.gate-image.outputs.digest }}
      gate_jre_digest: ${{ steps.gate-jre-image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Create image ref and version
        id: image-ref
        run: |
          REF=$(git rev-parse --short $GITHUB_SHA)
          # Get version from git tags or use commit-based version
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev-${REF}")
          IMAGE=${{ env.REGISTRY }}/${{ github.repository }}:${REF}
          IMAGE_LATEST=${{ env.REGISTRY }}/${{ github.repository }}:latest
          IMAGE_JRE=${{ env.REGISTRY }}/${{ github.repository }}/jre:${REF}
          IMAGE_JRE_LATEST=${{ env.REGISTRY }}/${{ github.repository }}/jre:latest

          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "image_latest=${IMAGE_LATEST}" >> $GITHUB_OUTPUT
          echo "image_jre=${IMAGE_JRE}" >> $GITHUB_OUTPUT
          echo "image_jre_latest=${IMAGE_JRE_LATEST}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # If building from a tag, extract the version tag for docker tagging
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION_TAG=${GITHUB_REF#refs/tags/}
            IMAGE_VERSION=${{ env.REGISTRY }}/${{ github.repository }}:${VERSION_TAG}
            IMAGE_JRE_VERSION=${{ env.REGISTRY }}/${{ github.repository }}/jre:${VERSION_TAG}
            echo "image_version=${IMAGE_VERSION}" >> $GITHUB_OUTPUT
            echo "image_jre_version=${IMAGE_JRE_VERSION}" >> $GITHUB_OUTPUT
            echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
            echo "Building images with version tag:" >> $GITHUB_STEP_SUMMARY
            echo "- ${IMAGE_VERSION}" >> $GITHUB_STEP_SUMMARY
            echo "- ${IMAGE_JRE_VERSION}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "Building images:" >> $GITHUB_STEP_SUMMARY
          echo "- ${IMAGE}" >> $GITHUB_STEP_SUMMARY
          echo "- ${IMAGE_JRE}" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${VERSION}" >> $GITHUB_STEP_SUMMARY

      - name: Build gate OCI image
        id: gate-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ steps.image-ref.outputs.image_latest }}
          cache-to: type=inline
          build-args: |
            VERSION=${{ steps.image-ref.outputs.version }}
          target: gate
          tags: |
            ${{ steps.image-ref.outputs.image }}
            ${{ steps.image-ref.outputs.image_latest }}
            ${{ steps.image-ref.outputs.image_version }}
          outputs: type=oci,dest=${{ runner.temp }}/gate-container-images/gate-image.tar,oci-mediatypes=true

      - name: Build gate JRE OCI image
        id: gate-jre-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ steps.image-ref.outputs.image_jre_latest }}
          cache-to: type=inline
          build-args: |
            VERSION=${{ steps.image-ref.outputs.version }}
          target: jre
          tags: |
            ${{ steps.image-ref.outputs.image_jre }}
            ${{ steps.image-ref.outputs.image_jre_latest }}
            ${{ steps.image-ref.outputs.image_jre_version }}
          outputs: type=oci,dest=${{ runner.temp }}/gate-container-images/gate-jre-image.tar,oci-mediatypes=true

      - name: Upload staged container images
        uses: actions/upload-artifact@v4
        with:
          name: gate-container-images
          path: ${{ runner.temp }}/gate-container-images
          if-no-files-found: error
          retention-days: 1

  # This job is intentionally a fresh runner. It receives only the two OCI
  # archives, never checks out the tagged tree, and is the only container path
  # with registry write access.
  build:
    needs: image-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: write
    outputs:
      image: ${{ needs.image-build.outputs.image }}
      image_latest: ${{ needs.image-build.outputs.image_latest }}
    steps:
      - name: Download staged container images
        uses: actions/download-artifact@v4
        with:
          name: gate-container-images
          path: release-images

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish staged container images
        env:
          GATE_DIGEST: ${{ needs.image-build.outputs.gate_digest }}
          GATE_JRE_DIGEST: ${{ needs.image-build.outputs.gate_jre_digest }}
        run: |
          set -euo pipefail

          for path in release-images/gate-image.tar release-images/gate-jre-image.tar; do
            if [ ! -f "$path" ] || [ -L "$path" ]; then
              echo "::error::Expected staged OCI archive $path is missing or is not a regular file."
              exit 1
            fi
          done
          while IFS= read -r -d '' path; do
            case "$path" in
              release-images/gate-image.tar|release-images/gate-jre-image.tar) ;;
              *)
                echo "::error::unexpected file $path in the staged container artifact."
                exit 1
                ;;
            esac
          done < <(find release-images -mindepth 1 -maxdepth 1 -print0)

          for digest in "$GATE_DIGEST" "$GATE_JRE_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid staged image digest: $digest"
              exit 1
            fi
          done

          REF="${GITHUB_SHA::7}"
          TAGS="${REF},latest"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAGS="${TAGS},${GITHUB_REF_NAME}"
          fi

          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}"
          IMAGE_JRE="${IMAGE}/jre"
          oras cp --from-oci-layout "release-images/gate-image.tar@${GATE_DIGEST}" "${IMAGE}:${TAGS}"
          oras cp --from-oci-layout "release-images/gate-jre-image.tar@${GATE_JRE_DIGEST}" "${IMAGE_JRE}:${TAGS}"

  # GoReleaser executes the tagged configuration and its hooks here with read
  # access only. Publication happens later on a clean runner.
  release-build:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --skip=publish,announce

      # checksums.txt is GoReleaser's own upload manifest. Use it as the
      # allowlist instead of globbing dist/, where tag-authored hooks or
      # dependencies could plant an unrelated file for the publisher.
      - name: Stage release artifacts from the manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ ! -f dist/checksums.txt ]; then
            echo "::error::GoReleaser produced no dist/checksums.txt for $RELEASE_TAG."
            exit 1
          fi

          rm -rf upload
          mkdir -p upload
          COUNT=0
          while read -r _ name; do
            [ -n "$name" ] || continue
            path=$(jq -r --arg n "$name" \
              'map(select(.name == $n and (.path // "") != "")) | first | .path // empty' \
              dist/artifacts.json)
            if [ -z "$path" ] || [ ! -f "$path" ]; then
              echo "::error::checksums.txt names $name but GoReleaser produced no such file."
              exit 1
            fi
            cp "$path" "upload/$name"
            COUNT=$((COUNT + 1))
          done < dist/checksums.txt

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::dist/checksums.txt for $RELEASE_TAG describes no artifacts."
            exit 1
          fi
          cp dist/checksums.txt upload/checksums.txt

      - name: Upload staged release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gate-release-assets
          path: |
            upload
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

  # This publisher starts with a clean workspace and never checks out or runs
  # tagged code. Only the manifest-allowlisted files cross the job boundary.
  releaser:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download staged release artifacts
        uses: actions/download-artifact@v4
        with:
          name: gate-release-assets

      - name: Publish staged release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          MANIFEST=dist/checksums.txt
          STAGED=upload
          if [ ! -f "$MANIFEST" ] || [ -L "$MANIFEST" ]; then
            echo "::error::Downloaded artifact has no regular dist/checksums.txt allowlist."
            exit 1
          fi
          if [ ! -d "$STAGED" ] || [ -L "$STAGED" ]; then
            echo "::error::Downloaded artifact has no regular upload directory."
            exit 1
          fi

          while IFS= read -r -d '' file; do
            if [ ! -f "$file" ] || [ -L "$file" ]; then
              echo "::error::unexpected file $file in release artifact; it is not a regular staged asset."
              exit 1
            fi
            base="$(basename "$file")"
            if [ "$base" != "checksums.txt" ] && ! awk -v n="$base" \
              'NF >= 2 && $2 == n { found = 1 } END { exit !found }' "$MANIFEST"; then
              echo "::error::unexpected file $file in release artifact; checksums.txt does not name it."
              exit 1
            fi
          done < <(find "$STAGED" -mindepth 1 -maxdepth 1 -print0)

          UPLOAD_FILES=()
          while read -r _ name; do
            if [ -z "$name" ]; then
              echo "::error::checksums.txt contains an empty asset name."
              exit 1
            fi
            name_base="$(basename -- "$name")"
            if [ "$name" != "$name_base" ] || [ "$name" = "." ] || [ "$name" = ".." ] \
              || [[ "$name" == *\\* ]] || [[ "$name" == -* ]]; then
              echo "::error::checksums.txt contains invalid asset name '$name'; expected a plain basename."
              exit 1
            fi
            file="$STAGED/$name"
            if [ ! -f "$file" ] || [ -L "$file" ]; then
              echo "::error::checksums.txt names $name but the downloaded artifact has no regular file."
              exit 1
            fi
            UPLOAD_FILES+=("$file")
          done < "$MANIFEST"

          if [ "${#UPLOAD_FILES[@]}" -eq 0 ]; then
            echo "::error::$MANIFEST describes no build artifacts."
            exit 1
          fi
          if [ ! -f "$STAGED/checksums.txt" ] || [ -L "$STAGED/checksums.txt" ]; then
            echo "::error::Downloaded artifact has no regular checksums.txt asset."
            exit 1
          fi
          if ! cmp -s "$MANIFEST" "$STAGED/checksums.txt"; then
            echo "::error::Staged checksums.txt differs from the publisher allowlist."
            exit 1
          fi
          UPLOAD_FILES+=("$STAGED/checksums.txt")

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --clobber --repo "$GITHUB_REPOSITORY" -- "${UPLOAD_FILES[@]}"

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Asset visibility is eventually consistent right after upload, so
          # poll briefly before declaring the release empty.
          ASSET_COUNT=0
          BUILD_COUNT=0
          BUILD_NAMES=""
          CHECKSUMS_ID=""
          CHECKSUMS_READ=false
          MISSING=""
          MANIFEST_BUILDS=0
          PROBE=""
          PROBE_URL=""
          PROBE_CODE=""
          CHECKSUMS_FILE=/tmp/published-checksums.txt

          # A non-empty asset list is NOT proof of a usable release. A release
          # carrying only a checksums.txt, a signature bundle, an SBOM or a
          # stray text/header file has a positive asset count and still offers
          # nothing anyone can run. Counting assets is the same defect as
          # trusting a green run without checking what it produced, so
          # classify by name/type and require a real downloadable BUILD.
          # Gate's builds are extensionless binaries (gate_<ver>_<os>_<arch>,
          # plus the _musl variants) or .exe on Windows, so none of them are
          # caught by these metadata patterns.
          BUILD_FILTER='[.assets[]
            | select(.state == "uploaded")
            | select(.name | test(
                "^checksums\\.txt$|^SHA(256|512)SUMS$|^LICENSE|^README|"
                + "\\.sig$|\\.sigstore\\.json$|\\.attest\\.spdx\\.json$|"
                + "\\.spdx\\.json$|\\.asc$|\\.pem$|\\.sha256$|"
                + "\\.h$|\\.hpp$|\\.md$|\\.txt$"
              ) | not)
            | select(.size > 0)]'

          for attempt in $(seq 1 12); do
            RELEASE_JSON=$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
            ASSET_COUNT=$(echo "$RELEASE_JSON" | jq '[.assets[] | select(.state == "uploaded")] | length')
            BUILD_COUNT=$(echo "$RELEASE_JSON" | jq "$BUILD_FILTER | length")
            BUILD_NAMES=$(echo "$RELEASE_JSON" | jq -r "$BUILD_FILTER | .[].name")
            CHECKSUMS_ID=$(echo "$RELEASE_JSON" \
              | jq -r '.assets[] | select(.name == "checksums.txt" and .state == "uploaded") | .id' \
              | head -n1)
            CHECKSUMS_READ=false
            MISSING=""
            : > "$CHECKSUMS_FILE"

            if [ -n "$CHECKSUMS_ID" ] && gh api "/repos/$GITHUB_REPOSITORY/releases/assets/$CHECKSUMS_ID" \
              -H 'Accept: application/octet-stream' > "$CHECKSUMS_FILE"; then
              CHECKSUMS_READ=true

              while read -r _ name; do
                [ -n "$name" ] || continue
                present=$(echo "$RELEASE_JSON" \
                  | jq -r --arg n "$name" \
                    '[.assets[] | select(.name == $n and .state == "uploaded")] | length')
                if [ "$present" -eq 0 ]; then
                  MISSING="$MISSING $name"
                fi
              done < "$CHECKSUMS_FILE"
            fi

            MANIFEST_BUILDS=0
            PROBE=""
            PROBE_URL=""
            PROBE_CODE=""
            if [ "$BUILD_COUNT" -gt 0 ] && [ "$CHECKSUMS_READ" = true ] \
              && [ -z "$MISSING" ]; then
              while read -r _ name; do
                [ -n "$name" ] || continue
                if echo "$BUILD_NAMES" | grep -Fxq "$name"; then
                  MANIFEST_BUILDS=$((MANIFEST_BUILDS + 1))
                fi
              done < "$CHECKSUMS_FILE"

              PROBE=$(echo "$BUILD_NAMES" | head -n1)
              PROBE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$PROBE"
              if ! PROBE_CODE=$(curl -sSL -o /dev/null -w '%{http_code}' -r 0-0 "$PROBE_URL"); then
                PROBE_CODE="000"
              fi
            fi

            if [ "$ASSET_COUNT" -gt 0 ] && [ "$BUILD_COUNT" -gt 0 ] \
              && [ -n "$CHECKSUMS_ID" ] && [ "$CHECKSUMS_READ" = true ] \
              && [ -z "$MISSING" ] && [ "$MANIFEST_BUILDS" -gt 0 ]; then
              case "$PROBE_CODE" in
                200|206) break ;;
              esac
            fi

            echo "Published assets are incomplete on $RELEASE_TAG (attempt $attempt); waiting..."
            sleep 10
          done

          echo "$RELEASE_JSON" | jq -r '.assets[] | "\(.name)\t\(.size)\t\(.state)"'
          if [ "$CHECKSUMS_READ" = true ]; then
            cat "$CHECKSUMS_FILE"
          else
            echo "checksums.txt contents unavailable."
          fi

          echo "Real build artifacts published ($BUILD_COUNT):"
          echo "${BUILD_NAMES:-  (none)}"

          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "::error::Release $RELEASE_TAG published with ZERO downloadable assets."
            echo "::error::A release with no artifact silently did not happen. Failing loudly."
            exit 1
          fi

          # Wrong-artifact-type is its own failure mode, distinct from empty.
          # It is the more dangerous one because the release looks populated.
          if [ "$BUILD_COUNT" -eq 0 ]; then
            echo "::error::Release $RELEASE_TAG has $ASSET_COUNT asset(s) but NO real build artifact."
            echo "::error::Only checksums/signatures/SBOMs/headers were published - nothing runnable."
            echo "::error::A positive asset count is not a release; a downloadable build is."
            exit 1
          fi

          # checksums.txt is the manifest every download path verifies against
          # (docs and install instructions point at <tag>/checksums.txt), so a
          # release without it is unusable even if other assets are present.
          if [ -z "$CHECKSUMS_ID" ]; then
            echo "::error::Release $RELEASE_TAG has $ASSET_COUNT asset(s) but no uploaded checksums.txt; the manifest is unresolvable."
            echo "::error::Anything resolving <tag>/checksums.txt first will 404."
            exit 1
          fi

          if [ "$CHECKSUMS_READ" != true ]; then
            echo "::error::Uploaded checksums.txt on $RELEASE_TAG could not be downloaded; the manifest is unresolvable."
            exit 1
          fi

          # Every artifact the manifest promises must actually be downloadable.
          # A checksums.txt that references missing assets 404s just as hard as
          # no release at all, only later and less visibly.
          if [ -n "$MISSING" ]; then
            echo "::error::checksums.txt on $RELEASE_TAG references assets that are not published; the manifest is unresolvable:$MISSING"
            exit 1
          fi

          # The manifest must promise a real build too. A checksums.txt that
          # lists only metadata resolves perfectly and still leaves every
          # consumer without a binary.
          if [ "$MANIFEST_BUILDS" -eq 0 ]; then
            echo "::error::checksums.txt on $RELEASE_TAG references no real build artifact; the manifest is unresolvable."
            exit 1
          fi

          # Finally prove one build is actually served, not merely listed by
          # the API. Range-request the first byte: a released asset that 404s
          # or is empty fails here rather than in a user's download.
          if [ "$PROBE_CODE" != "200" ] && [ "$PROBE_CODE" != "206" ]; then
            echo "::error::Build artifact $PROBE is listed on $RELEASE_TAG but not downloadable (HTTP $PROBE_CODE); the build is undownloadable."
            echo "::error::$PROBE_URL"
            exit 1
          fi

          echo "OK: $RELEASE_TAG publishes $BUILD_COUNT real build artifact(s) of $ASSET_COUNT assets;"
          echo "OK: checksums.txt resolves to all of them and $PROBE downloads (HTTP $PROBE_CODE)."

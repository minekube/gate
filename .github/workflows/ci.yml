name: ci
on:
  push:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify generated WebAssembly API contract
        run: make wasm-api-check

      - name: Upload WebAssembly API contract
        uses: actions/upload-artifact@v6
        with:
          name: gate-wasm-api-contract
          path: |
            internal/wasm/api/contract.json
            internal/wasm/api/manifest.json
            internal/wasm/api/gate.wit

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: golangci-lint
        run: golangci-lint run --timeout 3m0s
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go with cache
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Smoke test - Geyserlite Windows auto-download starts
        if: matrix.platform == 'windows-latest'
        run: go test ./pkg/edition/bedrock/geyser -tags=geyserlite_smoke -run TestLiteManagedRunnerWindowsAutoDownloadSmoke -count=1 -timeout 6m -v
  wasm-native-feasibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            rust_toolchain: "1.94.0"
          - platform: macos-latest
            rust_toolchain: "1.94.0"
          - platform: windows-latest
            rust_toolchain: "1.94.0-x86_64-pc-windows-gnu"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go with cache
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod

      - name: Setup pinned Rust toolchain
        run: rustup toolchain install ${{ matrix.rust_toolchain }} --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: internal/wasm/runtime/native -> target

      - name: Verify statically linked Wasm component runtime
        run: make wasm-native-test
  release-binaries:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - lint
      - test
      - wasm-native-feasibility
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            goos: linux
            goarch: amd64
            rust_toolchain: "1.94.0"
            extension: ""
            shell: bash
          - platform: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            rust_toolchain: "1.94.0"
            extension: ""
            shell: bash
          - platform: macos-13
            goos: darwin
            goarch: amd64
            rust_toolchain: "1.94.0"
            extension: ""
            shell: bash
          - platform: macos-14
            goos: darwin
            goarch: arm64
            rust_toolchain: "1.94.0"
            extension: ""
            shell: bash
          - platform: windows-latest
            goos: windows
            goarch: amd64
            rust_toolchain: "1.94.0-x86_64-pc-windows-gnu"
            extension: ".exe"
            shell: msys2 {0}
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go with cache
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod

      - name: Setup pinned Rust toolchain
        run: rustup toolchain install ${{ matrix.rust_toolchain }} --profile minimal

      - name: Install Windows C toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc make
          path-type: inherit

      - name: Build static Wasmtime archive
        shell: ${{ matrix.shell }}
        run: make wasm-native-lib

      - name: Build Gate release binary
        shell: ${{ matrix.shell }}
        run: |
          set -euo pipefail
          mkdir -p release
          version="${GITHUB_REF_NAME#v}"
          output="release/gate_${version}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.extension }}"
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -tags=wasm_native \
              -ldflags="-s -w -X 'go.minekube.com/gate/pkg/version.Version=${GITHUB_REF_NAME}'" \
              -o "$output" gate.go

      - name: Verify release binary starts
        if: runner.os != 'Windows'
        shell: bash
        run: release/gate_* --version

      - name: Upload release binary
        uses: actions/upload-artifact@v6
        with:
          name: gate-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error
  # Regression test for https://github.com/minekube/gate/issues/697:
  # The published images crashed with "exec /gate: no such file or directory"
  # because the gate binary is dynamically linked (the geyserlite dependency
  # pulls in github.com/ebitengine/purego, which imports libdl.so.2 via
  # //go:cgo_import_dynamic even with CGO_ENABLED=0) but the runtime base image
  # had no glibc dynamic loader. This job builds the actual images and runs the
  # binary and starts managed Bedrock on both architectures so broken runtime
  # dependencies or cache paths fail CI instead of shipping.
  docker-smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build gate image (host arch, load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          target: gate
          build-args: |
            VERSION=smoke-test
          tags: gate:smoke

      - name: Smoke test - gate binary execs in distroless image
        run: |
          out="$(docker run --rm gate:smoke --version)"
          echo "$out"
          echo "$out" | grep -q "gate version smoke-test"

      - name: Smoke test - managed Bedrock starts in read-only distroless image
        run: |
          cid=$(docker run -d --read-only --tmpfs /tmp \
            -v "$PWD/.github/testdata/managed-bedrock.yml:/config.yml:ro" \
            gate:smoke --config /config.yml)
          trap 'docker logs "$cid" 2>&1 || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 180); do
            logs=$(docker logs "$cid" 2>&1)
            if grep -q "geyser integration started" <<<"$logs"; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
              exit 1
            fi
            sleep 1
          done
          exit 1

      - name: Build jre variant image (host arch, load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          target: jre
          build-args: |
            VERSION=smoke-test
          tags: gate-jre:smoke

      - name: Smoke test - gate binary execs in jre image
        run: |
          out="$(docker run --rm gate-jre:smoke --version)"
          echo "$out"
          echo "$out" | grep -q "gate version smoke-test"
  build:
    if: ( github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') ) || ( github.event_name == 'push' && ( github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') ) )
    needs:
      - lint
      - test
      - wasm-native-feasibility
      - docker-smoke
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
      image_latest: ${{ steps.image-ref.outputs.image_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image ref and version
        id: image-ref
        run: |
          REF=$(git rev-parse --short $GITHUB_SHA)
          # Get version from git tags or use commit-based version
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev-${REF}")
          IMAGE=${{ env.REGISTRY }}/${{ github.repository }}:${REF}
          IMAGE_LATEST=${{ env.REGISTRY }}/${{ github.repository }}:latest
          IMAGE_JRE=${{ env.REGISTRY }}/${{ github.repository }}/jre:${REF}
          IMAGE_JRE_LATEST=${{ env.REGISTRY }}/${{ github.repository }}/jre:latest

          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "image_latest=${IMAGE_LATEST}" >> $GITHUB_OUTPUT
          echo "image_jre=${IMAGE_JRE}" >> $GITHUB_OUTPUT
          echo "image_jre_latest=${IMAGE_JRE_LATEST}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # If building from a tag, extract the version tag for docker tagging
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION_TAG=${GITHUB_REF#refs/tags/}
            IMAGE_VERSION=${{ env.REGISTRY }}/${{ github.repository }}:${VERSION_TAG}
            IMAGE_JRE_VERSION=${{ env.REGISTRY }}/${{ github.repository }}/jre:${VERSION_TAG}
            echo "image_version=${IMAGE_VERSION}" >> $GITHUB_OUTPUT
            echo "image_jre_version=${IMAGE_JRE_VERSION}" >> $GITHUB_OUTPUT
            echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
            echo "Building images with version tag:" >> $GITHUB_STEP_SUMMARY
            echo "- ${IMAGE_VERSION}" >> $GITHUB_STEP_SUMMARY
            echo "- ${IMAGE_JRE_VERSION}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "Building images:" >> $GITHUB_STEP_SUMMARY
          echo "- ${IMAGE}" >> $GITHUB_STEP_SUMMARY
          echo "- ${IMAGE_JRE}" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${VERSION}" >> $GITHUB_STEP_SUMMARY

      - name: Build and push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ steps.image-ref.outputs.image_latest }}
          cache-to: type=inline
          build-args: |
            VERSION=${{ steps.image-ref.outputs.version }}
          target: gate
          tags: |
            ${{ steps.image-ref.outputs.image }}
            ${{ steps.image-ref.outputs.image_latest }}
            ${{ steps.image-ref.outputs.image_version }}

      - name: Build and push docker image (jre variant)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ steps.image-ref.outputs.image_jre_latest }}
          cache-to: type=inline
          build-args: |
            VERSION=${{ steps.image-ref.outputs.version }}
          target: jre
          tags: |
            ${{ steps.image-ref.outputs.image_jre }}
            ${{ steps.image-ref.outputs.image_jre_latest }}
            ${{ steps.image-ref.outputs.image_jre_version }}
  releaser:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - release-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download platform release binaries
        uses: actions/download-artifact@v7
        with:
          pattern: gate-*
          path: dist/release
          merge-multiple: true

      - name: Publish statically linked release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum gate_* > checksums.txt
          cd ../..
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/release/* --clobber

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Asset visibility is eventually consistent right after upload, so
          # poll briefly before declaring the release empty.
          ASSET_COUNT=0
          BUILD_COUNT=0
          BUILD_NAMES=""
          CHECKSUMS_ID=""
          CHECKSUMS_READ=false
          MISSING=""
          MANIFEST_BUILDS=0
          PROBE=""
          PROBE_URL=""
          PROBE_CODE=""
          CHECKSUMS_FILE=/tmp/published-checksums.txt

          # A non-empty asset list is NOT proof of a usable release. A release
          # carrying only a checksums.txt, a signature bundle, an SBOM or a
          # stray text/header file has a positive asset count and still offers
          # nothing anyone can run. Counting assets is the same defect as
          # trusting a green run without checking what it produced, so
          # classify by name/type and require a real downloadable BUILD.
          # Gate's builds are extensionless binaries (gate_<ver>_<os>_<arch>,
          # plus the _musl variants) or .exe on Windows, so none of them are
          # caught by these metadata patterns.
          BUILD_FILTER='[.assets[]
            | select(.state == "uploaded")
            | select(.name | test(
                "^checksums\\.txt$|^SHA(256|512)SUMS$|^LICENSE|^README|"
                + "\\.sig$|\\.sigstore\\.json$|\\.attest\\.spdx\\.json$|"
                + "\\.spdx\\.json$|\\.asc$|\\.pem$|\\.sha256$|"
                + "\\.h$|\\.hpp$|\\.md$|\\.txt$"
              ) | not)
            | select(.size > 0)]'

          for attempt in $(seq 1 12); do
            RELEASE_JSON=$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
            ASSET_COUNT=$(echo "$RELEASE_JSON" | jq '[.assets[] | select(.state == "uploaded")] | length')
            BUILD_COUNT=$(echo "$RELEASE_JSON" | jq "$BUILD_FILTER | length")
            BUILD_NAMES=$(echo "$RELEASE_JSON" | jq -r "$BUILD_FILTER | .[].name")
            CHECKSUMS_ID=$(echo "$RELEASE_JSON" \
              | jq -r '.assets[] | select(.name == "checksums.txt" and .state == "uploaded") | .id' \
              | head -n1)
            CHECKSUMS_READ=false
            MISSING=""
            : > "$CHECKSUMS_FILE"

            if [ -n "$CHECKSUMS_ID" ] && gh api "/repos/$GITHUB_REPOSITORY/releases/assets/$CHECKSUMS_ID" \
              -H 'Accept: application/octet-stream' > "$CHECKSUMS_FILE"; then
              CHECKSUMS_READ=true

              while read -r _ name; do
                [ -n "$name" ] || continue
                present=$(echo "$RELEASE_JSON" \
                  | jq -r --arg n "$name" \
                    '[.assets[] | select(.name == $n and .state == "uploaded")] | length')
                if [ "$present" -eq 0 ]; then
                  MISSING="$MISSING $name"
                fi
              done < "$CHECKSUMS_FILE"
            fi

            MANIFEST_BUILDS=0
            PROBE=""
            PROBE_URL=""
            PROBE_CODE=""
            if [ "$BUILD_COUNT" -gt 0 ] && [ "$CHECKSUMS_READ" = true ] \
              && [ -z "$MISSING" ]; then
              while read -r _ name; do
                [ -n "$name" ] || continue
                if echo "$BUILD_NAMES" | grep -Fxq "$name"; then
                  MANIFEST_BUILDS=$((MANIFEST_BUILDS + 1))
                fi
              done < "$CHECKSUMS_FILE"

              PROBE=$(echo "$BUILD_NAMES" | head -n1)
              PROBE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$PROBE"
              if ! PROBE_CODE=$(curl -sSL -o /dev/null -w '%{http_code}' -r 0-0 "$PROBE_URL"); then
                PROBE_CODE="000"
              fi
            fi

            if [ "$ASSET_COUNT" -gt 0 ] && [ "$BUILD_COUNT" -gt 0 ] \
              && [ -n "$CHECKSUMS_ID" ] && [ "$CHECKSUMS_READ" = true ] \
              && [ -z "$MISSING" ] && [ "$MANIFEST_BUILDS" -gt 0 ]; then
              case "$PROBE_CODE" in
                200|206) break ;;
              esac
            fi

            echo "Published assets are incomplete on $RELEASE_TAG (attempt $attempt); waiting..."
            sleep 10
          done

          echo "$RELEASE_JSON" | jq -r '.assets[] | "\(.name)\t\(.size)\t\(.state)"'
          if [ "$CHECKSUMS_READ" = true ]; then
            cat "$CHECKSUMS_FILE"
          else
            echo "checksums.txt contents unavailable."
          fi

          echo "Real build artifacts published ($BUILD_COUNT):"
          echo "${BUILD_NAMES:-  (none)}"

          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "::error::Release $RELEASE_TAG published with ZERO downloadable assets."
            echo "::error::A release with no artifact silently did not happen. Failing loudly."
            exit 1
          fi

          # Wrong-artifact-type is its own failure mode, distinct from empty.
          # It is the more dangerous one because the release looks populated.
          if [ "$BUILD_COUNT" -eq 0 ]; then
            echo "::error::Release $RELEASE_TAG has $ASSET_COUNT asset(s) but NO real build artifact."
            echo "::error::Only checksums/signatures/SBOMs/headers were published - nothing runnable."
            echo "::error::A positive asset count is not a release; a downloadable build is."
            exit 1
          fi

          # checksums.txt is the manifest every download path verifies against
          # (docs and install instructions point at <tag>/checksums.txt), so a
          # release without it is unusable even if other assets are present.
          if [ -z "$CHECKSUMS_ID" ]; then
            echo "::error::Release $RELEASE_TAG has $ASSET_COUNT asset(s) but no uploaded checksums.txt; the manifest is unresolvable."
            echo "::error::Anything resolving <tag>/checksums.txt first will 404."
            exit 1
          fi

          if [ "$CHECKSUMS_READ" != true ]; then
            echo "::error::Uploaded checksums.txt on $RELEASE_TAG could not be downloaded; the manifest is unresolvable."
            exit 1
          fi

          # Every artifact the manifest promises must actually be downloadable.
          # A checksums.txt that references missing assets 404s just as hard as
          # no release at all, only later and less visibly.
          if [ -n "$MISSING" ]; then
            echo "::error::checksums.txt on $RELEASE_TAG references assets that are not published; the manifest is unresolvable:$MISSING"
            exit 1
          fi

          # The manifest must promise a real build too. A checksums.txt that
          # lists only metadata resolves perfectly and still leaves every
          # consumer without a binary.
          if [ "$MANIFEST_BUILDS" -eq 0 ]; then
            echo "::error::checksums.txt on $RELEASE_TAG references no real build artifact; the manifest is unresolvable."
            exit 1
          fi

          # Finally prove one build is actually served, not merely listed by
          # the API. Range-request the first byte: a released asset that 404s
          # or is empty fails here rather than in a user's download.
          if [ "$PROBE_CODE" != "200" ] && [ "$PROBE_CODE" != "206" ]; then
            echo "::error::Build artifact $PROBE is listed on $RELEASE_TAG but not downloadable (HTTP $PROBE_CODE); the build is undownloadable."
            echo "::error::$PROBE_URL"
            exit 1
          fi

          echo "OK: $RELEASE_TAG publishes $BUILD_COUNT real build artifact(s) of $ASSET_COUNT assets;"
          echo "OK: checksums.txt resolves to all of them and $PROBE downloads (HTTP $PROBE_CODE)."

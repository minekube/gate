name: Release Please

# Merge-to-release policy (authoritative):
# - Every push to master runs Release Please. When it finds a release-eligible
#   change, this workflow merges the generated release PR, reruns itself on
#   master, creates the tag and GitHub release, and calls release-publish.yml.
# - Merging a release-eligible change to master therefore approves that release.
#   PR text, labels, and task-local instructions such as "do not release" do not
#   suppress it. A release hold must first be implemented in this workflow and
#   protected by matching regression coverage.

# Renovate can now auto-merge geyserlite bumps with a fix(deps): commit.
# This workflow turns those conventional commits on master into normal Gate
# GitHub releases. The release-please tag is created with GITHUB_TOKEN, so it
# will not recursively trigger ci.yml by tag push; the trigger-release job
# calls the trusted release-publish workflow from this default-branch file.

on:
  push:
    branches: [master]
  repository_dispatch:
    types: [release-please-rerun]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pr_number: ${{ steps.rp.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: rp
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Auto-merge release PR
        if: ${{ steps.rp.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(echo '${{ steps.rp.outputs.pr }}' | jq -r '.number')
          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --merge

          # Merges done with GITHUB_TOKEN do not trigger a new push workflow.
          # Run this workflow again on master so release-please observes the
          # merged release PR and creates the tag/GitHub release.
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/dispatches" \
            -f event_type=release-please-rerun

  trigger-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-publish.yml
    permissions:
      actions: read
      contents: write
      packages: write
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}

  dispatch-moxy-bump:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: minekube/actions/.github/workflows/dispatch-workflow.yml@0d24c686ae9c5df7841e2158f2f0942cd452f870
    permissions:
      contents: read
      id-token: write
    with:
      target-repository: moxy
      target-workflow: bump-gate.yml
      target-ref: main
      inputs-json: |
        {
          "version": "${{ needs.release-please.outputs.tag_name }}",
          "source_repository": "${{ github.repository }}",
          "source_release_url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag_name }}"
        }
    secrets: inherit
